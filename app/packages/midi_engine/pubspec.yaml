name: midi_engine
description: "The airmidi desktop app's MIDI engine: libremidi over dart:ffi (ports, timestamped input, scheduled output)."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.6.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
