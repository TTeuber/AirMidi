name: ci
on:
  push:
  pull_request:

jobs:
  host-tests:
    # lib/ on the host with AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S test -B test/build
      - run: cmake --build test/build -j
      - run: ctest --test-dir test/build --output-on-failure

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format 18.1.8 (the version .clang-format names)
        run: |
          files=$(git ls-files '*.c' '*.h' | grep -v -e '^test/unity/' -e '^spikes/')
          pipx run --spec clang-format==18.1.8 clang-format --dry-run --Werror $files

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [c6, s3, s3kit]
        include:
          - board: c6
            target: esp32c6
          - board: s3
            target: esp32s3
          - board: s3kit  # the ESP32-S3-DevKitC-1 on its own
            target: esp32s3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs the tags for the version string
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5  # the first release with httpd ws_post_handshake_cb (webui)
          target: ${{ matrix.target }}
          path: firmware
          # build.sh signs the image with a throwaway key it generates (CI builds are not for installing). The action
          # sets git's safe.directory itself and pastes this line into a single-quoted bash -c: no single quotes here.
          command: ./build.sh ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: airmidi-${{ matrix.board }}
          path: |
            firmware/build_${{ matrix.board }}/airmidi.bin
            firmware/build_${{ matrix.board }}/bootloader/bootloader.bin
            firmware/build_${{ matrix.board }}/partition_table/partition-table.bin
            firmware/build_${{ matrix.board }}/flash_args
