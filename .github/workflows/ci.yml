name: ci
on:
  push:
  pull_request:

jobs:
  host-tests:
    # lib/ on the host with AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S test -B test/build
      - run: cmake --build test/build -j
      - run: ctest --test-dir test/build --output-on-failure

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: clang-format 18.1.8 (the version .clang-format names)
        run: |
          files=$(git ls-files '*.c' '*.h' | grep -v -e '^test/unity/' -e '^spikes/' -e '/third_party/')
          pipx run --spec clang-format==18.1.8 clang-format --dry-run --Werror $files

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [c6, s3, s3b, s3kit]
        include:
          - board: c6
            target: esp32c6
          - board: s3
            target: esp32s3
          - board: s3b  # receiver rev B: the four-button panel
            target: esp32s3
          - board: s3kit  # the ESP32-S3-DevKitC-1 on its own
            target: esp32s3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # git describe needs the tags for the version string
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5  # the first release with httpd ws_post_handshake_cb (webui)
          target: ${{ matrix.target }}
          path: firmware
          # build.sh signs the image with a throwaway key it generates (CI builds are not for installing). The action
          # sets git's safe.directory itself and pastes this line into a single-quoted bash -c: no single quotes here.
          command: ./build.sh ${{ matrix.board }}
      - uses: actions/upload-artifact@v7
        with:
          name: airmidi-${{ matrix.board }}
          path: |
            firmware/build_${{ matrix.board }}/airmidi.bin
            firmware/build_${{ matrix.board }}/bootloader/bootloader.bin
            firmware/build_${{ matrix.board }}/partition_table/partition-table.bin
            firmware/build_${{ matrix.board }}/flash_args

  # The app: analyzer and tests, the Android and Mac release builds. The Flutter version is the one app/.fvmrc pins.
  app-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: flutter
        run: echo "version=$(jq -r .flutter app/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  app-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: flutter
        run: echo "version=$(jq -r .flutter app/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      # build.gradle.kts signs with ~/.android/debug.keystore; the runner has none, so make a throwaway one
      - run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - run: flutter build apk --release
        working-directory: app

  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - id: flutter
        run: echo "version=$(jq -r .flutter app/.fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter build macos --release
        working-directory: app
