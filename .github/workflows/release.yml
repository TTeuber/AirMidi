name: release
# Push a tag vX.Y.Z: both boards are built, signed with the release key, and published with a manifest.json, which
# is what boxes in the field read (Kconfig AIRMIDI_UPDATE_BASE_URL -> releases/latest/download).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [c6, s3]
        include:
          - board: c6
            target: esp32c6
          - board: s3
            target: esp32s3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: release signing key (repository secret AIRMIDI_SIGNING_KEY)
        env:
          KEY: ${{ secrets.AIRMIDI_SIGNING_KEY }}
        run: |
          test -n "$KEY" || { echo "AIRMIDI_SIGNING_KEY is not set"; exit 1; }
          mkdir -p firmware/keys
          printf '%s\n' "$KEY" > firmware/keys/release_signing_key.pem
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: ${{ matrix.target }}
          path: firmware
          # the action sets git's safe.directory and wraps this in a single-quoted bash -c: no single quotes here
          command: >-
            EXTRA_DEFAULTS=sdkconfig.release PROJECT_VER=${{ github.ref_name }} ./build.sh ${{ matrix.board }}
      - name: collect
        run: |
          b=firmware/build_${{ matrix.board }}
          mkdir -p out/flash
          cp $b/airmidi.bin out/airmidi-${{ matrix.board }}.bin
          # for a first install over USB: esptool.py write_flash @flash_args
          cp $b/bootloader/bootloader.bin $b/partition_table/partition-table.bin $b/ota_data_initial.bin \
             $b/airmidi.bin $b/flash_args out/flash/
          (cd out/flash && zip -q ../airmidi-${{ matrix.board }}-usb-flash.zip *)
          rm -r out/flash
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.board }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: manifest.json
        run: |
          cat > out/manifest.json <<JSON
          {"version": "${{ github.ref_name }}", "images": {"c6": "airmidi-c6.bin", "s3": "airmidi-s3.bin"}}
          JSON
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
